# Udaan CI/CD Deployment Workflow Template
# To use this in GitHub Actions:
# Ensure your Personal Access Token / repo permissions have `workflow` scope enabled,
# then place this file at .github/workflows/deploy.yml in the repository.

name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/udaan-app
            git pull origin main
            docker compose up -d --build
            docker image prune -f
