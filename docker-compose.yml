services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-udaan_db}
      POSTGRES_USER: ${POSTGRES_USER:-udaan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-udaan_secure_pass_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-udaan_user} -d ${POSTGRES_DB:-udaan_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-udaan_user}:${POSTGRES_PASSWORD:-udaan_secure_pass_123}@postgres:5432/${POSTGRES_DB:-udaan_db}
      FIREBASE_CREDENTIALS_PATH: /app/secrets/serviceAccountKey.json
    volumes:
      - ./secrets:/app/secrets:ro
      - static_volume:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_USE_MOCK: "false"
        VITE_API_URL: "/api"
        VITE_GOOGLE_MAPS_KEY: "${VITE_GOOGLE_MAPS_KEY:-}"
        VITE_RAZORPAY_KEY: "${VITE_RAZORPAY_KEY:-rzp_test_udaan_demo}"
        NEXT_PUBLIC_USE_MOCK: "false"
        NEXT_PUBLIC_API_URL: "/api"
        NEXT_PUBLIC_GOOGLE_MAPS_KEY: "${NEXT_PUBLIC_GOOGLE_MAPS_KEY:-}"
        NEXT_PUBLIC_RAZORPAY_KEY: "${NEXT_PUBLIC_RAZORPAY_KEY:-rzp_test_udaan_demo}"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  static_volume:
  certbot_www:
  certbot_conf:
